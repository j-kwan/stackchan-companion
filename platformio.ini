; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = companion

[env:m5stack-cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; Le core Arduino ESP32 ajoute SA norme APRÈS build_flags (le dernier gagne) :
; sans cet unflag, le -std=gnu++17 ci-dessous est silencieusement ignoré.
; Découvert en P0 avec le core 2.x, qui ajoutait -std=gnu++11 (les `inline
; static` ne passaient que par tolérance de GCC).
;
; LE CORE 3.x (pioarduino) A CHANGÉ CES VALEURS, et l'unflag écrit pour le
; core 2.x ne retirait donc plus rien : la ligne de commande réelle finissait
; par « -std=gnu++17 ... -std=gnu++2b ... -std=gnu++2a » et le firmware
; compilait en C++20 pendant que ce fichier, les tests natifs (gnu++17) et
; toute la documentation disaient C++17. Même piège que la première fois, avec
; une autre valeur — d'où les trois normes listées plutôt que la seule qui
; casse aujourd'hui. Vérification : `pio run -t idedata`, dernier -std gagnant.
;
; On REVIENT à C++17 au lieu d'entériner le C++20 : c'est la norme sous
; laquelle tout ce code a été écrit, testé nativement et relu. Passer en C++20
; est une décision qui se prend seule, avec l'env `native` aligné en même
; temps — pas un effet de bord d'une migration de plateforme.
build_unflags = -std=gnu++11 -std=gnu++2a -std=gnu++2b
build_flags =
	-std=gnu++17
	; ERREUR seulement (ex-3 = INFO). Ce n'est pas de la cosmetique depuis le core
	; 3.x : `Serial` est l'USB CDC, et HWCDC::write prend son verrou avec un
	; timeout de 100 ms puis peut enchainer plusieurs de ces attentes quand l'hote
	; ne vide pas (cable branche, moniteur ferme). loop() tourne sur le coeur 1
	; avec le renderer -- une ligne de log du framework peut donc affamer le
	; polling tactile exactement comme une frame trop longue (A2.22). Nos propres
	; Serial.printf et sce::trace ne passent PAS par ces macros et restent
	; intacts ; seul le bavardage INFO de WiFi/IDF disparait. Remonter a 3 le
	; temps d'une session de debug reseau.
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_M5STACK_CORES3
	-I${PROJECT_DIR}/src
	; Le core Arduino 3.x compile avec -Werror=return-type, et M5Unified 0.2.20
	; (utility/Log_Class.hpp) a un chemin sans return explicite. C'est un defaut
	; de la LIB, pas du projet : on degrade l'erreur en avertissement plutot que
	; de patcher un fichier de dependance, qu'un `pio pkg update` reecrirait.
	; ICI, dans le parent, et non recopie par environnement : l'en-tete n'est
	; instancie que par les unites qui incluent stackchan-arduino (companion et
	; flight-radar), donc poser le drapeau au cas par cas revenait a le poser la
	; ou ca avait casse, puis a le reposer ailleurs a la panne suivante. A
	; retirer le jour ou M5Unified corrige.
	; RESERVE : les trois envs -fire REMPLACENT build_flags en entier (`extends`
	; substitue option par option) et ne recoivent donc PAS cette ligne du
	; parent. Ils la portent chacun, non pas parce qu'ils cassent aujourd'hui --
	; aucun n'inclut stackchan-arduino -- mais parce que le jour ou l'un d'eux
	; touchera M5.Log, l'erreur tombera dans un env dont le build_flags ne dit
	; rien du correctif applique partout ailleurs.
	-Wno-error=return-type
lib_deps = 
    ; EPINGLES AU CRAN EXACT (2026-08-25). `^0.2.3` couvre toute la ligne 0.2.x :
    ; la reinstallation des dependances qu'a entrainee le passage a pioarduino a
    ; fait glisser M5Unified 0.2.16 -> 0.2.20 et M5GFX 0.2.22 -> 0.2.28 sans que
    ; rien ne le demande, et 0.2.28 apporte un Bus_I2C reecrit et un
    ; getSpiClockFrequency() tout neuf -- l'i2c partage G11/G12 et l'horloge SPI
    ; du LCD, c'est-a-dire les deux bus dont ce projet tient la contention a la
    ; main (A2.16, regle 15). Une pile d'affichage/tactile/audio qui bouge toute
    ; seule est la meme panne en silence qu'ESP32Servo juste au-dessus.
    ; M5GFX est NOMME ici alors qu'il n'arrive qu'en transitif par M5Unified :
    ; une dependance qu'on ne nomme pas est une dependance que personne ne relit.
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
	meganetaaan/M5Stack-Avatar @ ^0.10.0
	esp32async/ESPAsyncWebServer@^3.11.0
	esp32async/AsyncTCP@^3.4.10
	tobozo/M5Stack-SD-Updater@^1.2.8
lib_ldf_mode = deep
; Exclure les implémentations AsyncTCP incompatibles tirées en dépendance transitive
; par esp32async/ESPAsyncWebServer : ESPAsyncTCP cible ESP8266, RPAsyncTCP cible RP2040
lib_ignore = ESPAsyncTCP, RPAsyncTCP

; -----------------------------------------------------------------------------
; companion : firmware principal (firmware/companion/)
; -----------------------------------------------------------------------------
[env:companion]
extends          = env:m5stack-cores3
build_src_filter = +<../firmware/companion/>
; Regenere src/app/WebConsoleGz.h (gzip des pages de src/app/WebConsole.h) AVANT
; chaque compilation : la console est servie pre-compressee (Content-Encoding:
; gzip), et le HTML en clair ne part JAMAIS en flash. Etape automatique et non
; manuelle par principe -- les deux fichiers divergeraient le jour ou quelqu'un
; edite le markup sans repenser au script. Sortie octet-stable : sans changement
; du markup, le header n'est pas reecrit et rien ne recompile.
extra_scripts    = pre:scripts/build/gen_console_gz.py
; --allow-multiple-definition : nos SCCB_* (firmware/companion/sccb_m5.cpp)
; remplacent ceux de la lib esp32-camera precompilee -> le bus de controle
; camera passe par M5.In_I2C (meme i2c que l'IMU) au lieu du driver IDF
; absent sur ce port (voir sccb_m5.cpp). Les objets projet passent avant
; l'archive libesp32-camera.a : nos definitions gagnent.
build_flags      = ${env:m5stack-cores3.build_flags} -DSCE_USE_SERVO
                   -Wl,--allow-multiple-definition
lib_deps =
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
    esp32async/ESPAsyncWebServer@^3.11.0
    esp32async/AsyncTCP@^3.4.10
    mongonta0716/stackchan-arduino @ ^0.0.4
    tobozo/M5Stack-SD-Updater@^1.2.8
    ; EPINGLE, et pas seulement tire en transitif (2026-08-24). Le passage au
    ; core Arduino 3.x (plateforme pioarduino ci-dessus) a retire ledcAttachPin,
    ; ledcSetup et dacWrite ; ESP32Servo 0.13, que stackchan-arduino amene sans
    ; version, les appelle encore et ne compile plus. La 3.0.x est la meme lib
    ; portee sur la nouvelle API. Une dependance transitive non epinglee est
    ; exactement ce qui casse en silence a un changement de core : elle n'est
    ; nommee nulle part, donc personne ne la relit.
    madhephaestus/ESP32Servo @ ^3.0.6
    ; NB (2026-07-21) : BLE (NimBLE) TENTÉ puis REVERTÉ — NimBLEDevice::init
    ; crashe en coexistence WiFi (boot-loop, recovery mode download manuel).
    ; Design conservé (docs/reference/PLUGINS.md §BLE) ; à reprendre en session dédiée
    ; avec accès physique (coexistence sdkconfig / ordre d'init à investiguer).

; -----------------------------------------------------------------------------
; flight-radar : .bin INVITÉ de démonstration (firmware/flight-radar/) —
; radar d'avions temps réel (adsb.lol) lancé par le Launcher/API [Bins],
; arrêtable à distance via le stub SceGuest (docs/guests/README.md).
; Position lue sur SD : /stackchan-companion/flightradar.yaml.
; -----------------------------------------------------------------------------
[env:flight-radar]
extends          = env:m5stack-cores3
build_src_filter = +<../firmware/flight-radar/>
lib_deps =
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
    tobozo/M5Stack-SD-Updater@^1.2.8
    bblanchon/ArduinoJson @ ^7.0.0
    ; Servos SCS0009 : option « tete pointee vers le vol traque » (OFF par
    ; defaut). Meme lib que le companion — protocole SCS deja eprouve sur
    ; ce materiel, pas de reimplementation du paquet WritePos a l'aveugle.
    mongonta0716/stackchan-arduino @ ^0.0.4
    ; MEME EPINGLAGE QUE LE COMPANION, et pour la meme raison : stackchan-arduino
    ; tire ESP32Servo, dont la 0.13 appelle ledcAttachPin/ledcSetup/dacWrite,
    ; retires du core Arduino 3.x. Les DEUX seuls environnements qui incluent
    ; stackchan-arduino sont donc les deux qui cassent, et c'est le meme
    ; correctif. Les autres bins invites ne dependent pas de cette lib et
    ; compilent tels quels.
    madhephaestus/ESP32Servo @ ^3.0.6

; -----------------------------------------------------------------------------
; flight-radar-fire : le MEME radar, en application AUTONOME sur M5Stack Fire.
;
; Pas un fork : la meme source, avec les differences materielles declarees en
; drapeaux de capacite (bloc "BOARD PROFILE" en tete de main.cpp). Le Fire a
; le meme ecran 320x240 et 4 Mo de PSRAM adressables, mais TROIS BOUTONS et pas de dalle
; tactile -- d'ou SCE_INPUT_BUTTONS, qui bascule la navigation sur la machine
; a etats pure de firmware/flight-radar/input.h (testee par test_input).
;
; Pas de K151 : ni servos SCS0009, ni PY32, ni LTR-553. Pas de companion non
; plus, donc pas de hall de demarrage ni de retour au lanceur -- mais SceGuest
; RESTE compile : c'est lui qui monte le WiFi et sert http://<ip>/config, qui
; remplace ici les deux modales tactiles (clavier et panneau de reglages).
;
; ATTENTION AU PORT. Ne JAMAIS televerser sans --upload-port : le StackChan
; est branche a cote et un mauvais choix ecrase son companion.
;   pio run -e flight-radar-fire -t upload --upload-port (.\scripts\dev\find-port.ps1 -Board fire)
; -----------------------------------------------------------------------------
;
; L'environnement HERITE de flight-radar (donc de m5stack-cores3) et ne
; redeclare QUE ce qui differe reellement : la carte, la vitesse d'upload, les
; drapeaux de compilation et la liste de bibliotheques. Tout le reste --
; platform, framework, monitor_speed, build_unflags, build_src_filter,
; lib_ldf_mode et surtout lib_ignore -- vient du parent. `extends` REMPLACE
; option par option (pas de fusion) : les build_flags ci-dessous se substituent
; INTEGRALEMENT a ceux du parent, d'ou l'absence de -DARDUINO_M5STACK_CORES3.
; La recopie manuelle precedente avait deja diverge : elle avait PERDU
; `lib_ignore = ESPAsyncTCP, RPAsyncTCP`, le jour ou une dependance transitive
; aurait tire l'implementation ESP8266 le build cassait ici seulement.
; -----------------------------------------------------------------------------
[env:flight-radar-fire]
extends          = env:flight-radar
board            = m5stack-fire
upload_speed     = 921600
build_flags =
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_M5STACK_FIRE
	-I${PROJECT_DIR}/src
	; Meme correctif M5Unified 0.2.3 que le parent (voir [env:m5stack-cores3]) :
	; recopie ici parce que `extends` REMPLACE build_flags au lieu de le fusionner.
	-Wno-error=return-type
	; --- profil de carte (defauts = CoreS3/K151, voir main.cpp)
	-DSCE_INPUT_BUTTONS=1
	-DSCE_HAS_SERVO=0
	-DSCE_HAS_LTR553=0
	-DSCE_COMPANION=0
	; SD sur VSPI (brochage M5Stack classique), et non les broches CoreS3
	-DSCE_SD_SCK=18 -DSCE_SD_MISO=19 -DSCE_SD_MOSI=23 -DSCE_SD_CS=4
	; WiFi de DERNIER RECOURS, pour un Fire SANS carte SD. La valeur vient de
	; l'ENVIRONNEMENT du shell qui lance la compilation, jamais d'ici : aucun
	; identifiant ne doit atterrir dans un fichier versionne (meme regle que
	; sdcard/stackchan-companion/config.yaml). Non definie => chaine vide => repli
	; en point d'acces "SCE-Guest" sur 192.168.4.1.
	;   $env:SCE_WIFI_SSID="..." ; $env:SCE_WIFI_PASS="..."
	-DSCE_WIFI_SSID='"${sysenv.SCE_WIFI_SSID}"'
	-DSCE_WIFI_PASS='"${sysenv.SCE_WIFI_PASS}"'
lib_deps =
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
	tobozo/M5Stack-SD-Updater@^1.2.8
	bblanchon/ArduinoJson @ ^7.0.0
	; PAS stackchan-arduino : sans SCE_HAS_SERVO la lib n'est plus incluse,
	; et la garder tirerait un pilote de servo dans un binaire qui n'a pas
	; de servo a piloter. C'est la SEULE difference avec la liste du parent,
	; et c'est pour elle que lib_deps est redeclare ici.

; -----------------------------------------------------------------------------
; space : .bin INVITE - instrument spatial de bureau (firmware/space/)
; ISS en direct (TLE Celestrak + SGP4 embarque), passages visibles calcules a
; bord, Lune, planetes a l'oeil nu, prochains lancements (Launch Library 2).
; Config : /space.yaml sur la carte. Detail : docs/guests/SPACE.md.
;
; PAS de stackchan-arduino : ce bin ne pilote pas les servos (le suivi de tete
; pendant un passage est au backlog, pas livre) -- inutile de tirer un pilote
; de servo dans un binaire qui n'en a pas l'usage.
; -----------------------------------------------------------------------------
[env:space]
extends          = env:m5stack-cores3
build_src_filter = +<../firmware/space/>
lib_deps =
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
    tobozo/M5Stack-SD-Updater@^1.2.8
    bblanchon/ArduinoJson @ ^7.0.0
    ; Servos SCS0009 : option "tete qui suit le satellite" (OFF par defaut),
    ; par firmware/common/HeadServo.h, partage avec flight-radar. Meme lib et
    ; meme epinglage d'ESP32Servo que le radar, pour la meme raison (core 3.x).
    mongonta0716/stackchan-arduino @ ^0.0.4
    madhephaestus/ESP32Servo @ ^3.0.6

; -----------------------------------------------------------------------------
; space-fire : le MEME instrument, en application AUTONOME sur M5Stack Fire.
;
; Meme demarche que flight-radar-fire, et meme source : les differences
; materielles sont des drapeaux de CAPACITE (bloc "BOARD PROFILE" en tete de
; main.cpp), jamais un fork. Le Fire a le meme ecran 320x240 et de la PSRAM ;
; il n'a pas de dalle tactile mais TROIS BOUTONS, d'ou SCE_INPUT_BUTTONS qui
; bascule la navigation sur la machine a etats pure de firmware/space/input.h
; (testee par test_spaceinput).
;
; Pas de companion : ni hall de demarrage, ni retour au lanceur, ni geste de
; sortie. SceGuest reste compile — c'est lui qui monte le WiFi et sert
; http://<ip>/config, seul endroit ou un Fire autonome apprend un reseau.
;
; PAS de -DSCE_HAS_LTR553=0, contrairement au radar : ici le capteur de
; lumiere est SONDE au boot et le resultat est publie dans le champ `diag` de
; /config. La sonde couvre deja la carte qui n'a pas le capteur, et en prime
; celle dont le capteur est mort. Voir le commentaire en tete de main.cpp.
;
; ATTENTION AU PORT. Ne JAMAIS televerser sans --upload-port : le StackChan
; est branche a cote et un mauvais choix ecrase son companion.
;   pio run -e space-fire -t upload --upload-port (.\scripts\dev\find-port.ps1 -Board fire)
;
; `extends` REMPLACE option par option (pas de fusion) : les build_flags
; ci-dessous se substituent INTEGRALEMENT a ceux du parent, d'ou l'absence de
; -DARDUINO_M5STACK_CORES3. Tout le reste (platform, framework, monitor_speed,
; build_unflags, build_src_filter, lib_ldf_mode, lib_ignore, lib_deps) vient du
; parent : lib_deps n'est PAS redeclare ici, la liste de `space` ne contenant
; deja aucune dependance propre au K151.
; -----------------------------------------------------------------------------
[env:space-fire]
extends          = env:space
board            = m5stack-fire
upload_speed     = 921600
build_flags =
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_M5STACK_FIRE
	-I${PROJECT_DIR}/src
	; Meme correctif M5Unified 0.2.3 que le parent (voir [env:m5stack-cores3]) :
	; recopie ici parce que `extends` REMPLACE build_flags au lieu de le fusionner.
	-Wno-error=return-type
	; --- profil de carte (defauts = CoreS3/K151, voir main.cpp)
	-DSCE_INPUT_BUTTONS=1
	-DSCE_COMPANION=0
	-DSCE_HAS_SERVO=0
	; SD sur VSPI (brochage M5Stack classique), et non les broches CoreS3
	-DSCE_SD_SCK=18 -DSCE_SD_MISO=19 -DSCE_SD_MOSI=23 -DSCE_SD_CS=4
	; WiFi de DERNIER RECOURS, pour un Fire SANS carte SD. La valeur vient de
	; l'ENVIRONNEMENT du shell qui lance la compilation, jamais d'ici : aucun
	; identifiant ne doit atterrir dans un fichier versionne (meme regle que
	; sdcard/stackchan-companion/config.yaml). Non definie => chaine vide => repli
	; en point d'acces "SCE-Guest" sur 192.168.4.1, ou /config attend.
	;   $env:SCE_WIFI_SSID="..." ; $env:SCE_WIFI_PASS="..."
	-DSCE_WIFI_SSID='"${sysenv.SCE_WIFI_SSID}"'
	-DSCE_WIFI_PASS='"${sysenv.SCE_WIFI_PASS}"'
lib_deps =
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
    tobozo/M5Stack-SD-Updater@^1.2.8
    bblanchon/ArduinoJson @ ^7.0.0
    ; PAS stackchan-arduino : SCE_HAS_SERVO=0, pas de servo a piloter sur un
    ; Fire. Seule difference avec la liste du parent, et la raison pour
    ; laquelle lib_deps est redeclare ici (comme flight-radar-fire).

; -----------------------------------------------------------------------------
; ha-remote : .bin INVITE - telecommande Home Assistant (firmware/ha-remote/)
; Liste les entites (volets, lumieres, prises, cameras) via l'API REST de HA
; et appelle ses services. NE PAS confondre avec docs/integrations/HOMEASSISTANT.md, qui
; decrit l'INVERSE (le companion expose a HA). Config : /stackchan-companion/
; ha-remote.yaml. Detail : docs/guests/HA-REMOTE.md
; -----------------------------------------------------------------------------
[env:ha-remote]
extends          = env:m5stack-cores3
build_src_filter = +<../firmware/ha-remote/>
lib_deps =
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
    tobozo/M5Stack-SD-Updater@^1.2.8
    bblanchon/ArduinoJson @ ^7.0.0

; -----------------------------------------------------------------------------
; led-fluid : .bin INVITE - simulation de fluide pilotee par l inclinaison
; (firmware/led-fluid/). Le fluide est peint en grille de pastilles ; panneau
; de physique au swipe droite, rectangle teinte/saturation au swipe gauche.
; Config : /stackchan-companion/ledfluid.yaml. Detail : docs/guests/LED-FLUID.md,
; spec complete : docs/ROADMAP.md S9.
;
; PAS d ArduinoJson : ce bin ne parle a aucune API, il n a rien a analyser.
; PAS de stackchan-arduino : il ne pilote pas les servos.
; -----------------------------------------------------------------------------
[env:led-fluid]
extends          = env:m5stack-cores3
build_src_filter = +<../firmware/led-fluid/>
lib_deps =
    m5stack/M5Unified @ 0.2.20
    m5stack/M5GFX     @ 0.2.28
    tobozo/M5Stack-SD-Updater@^1.2.8

; -----------------------------------------------------------------------------
; led-fluid-fire : le MEME fluide, en application AUTONOME sur M5Stack Fire.
;
; Ce bin a longtemps ete annonce comme NON portable : son interface est batie
; sur le glissement (panneau au swipe, valeur au drag, pichenette a l endroit
; touche). C etait vrai de l INTERFACE, pas du bin. Le portage ne remet donc pas
; les memes gestes sur des boutons, il redit ce que chaque geste VOULAIT dire :
; firmware/led-fluid/input.h porte ce vocabulaire, teste nativement
; (test_fluidinput), et applyEvent() dans main.cpp en est l UNIQUE consommateur.
; Le tactile et les boutons sont deux producteurs, comme sur le radar et space.
;
; Le Fire a bien un IMU (MPU6886), donc l inclinaison — le coeur du bin —
; marche. Il est monte autrement que sur le CoreS3 : c est exactement a quoi
; servent les trois cases tilt_swap / tilt_inv_x / tilt_inv_y de /config.
;
; -DSCE_HAS_PY32=0 : l anneau WS2812 est sur le CORPS K151, derriere un
; expandeur PY32 sur Wire1 (G12/G11). Contrairement au capteur de lumiere, on ne
; peut pas le SONDER sans risque : sur un ESP32 classique les GPIO 6-11 sont la
; FLASH SPI. Une capacite qu on ne peut pas interroger sans danger se declare.
; Le capteur de lumiere, lui, reste sonde (M5.In_I2C) comme dans `space`.
;
; ATTENTION AU PORT. Ne JAMAIS televerser sans --upload-port : le StackChan
; est branche a cote et un mauvais choix ecrase son companion.
;   pio run -e led-fluid-fire -t upload --upload-port (.\scripts\dev\find-port.ps1 -Board fire)
;
; `extends` REMPLACE option par option (pas de fusion) : les build_flags
; ci-dessous se substituent INTEGRALEMENT a ceux du parent, d ou l absence de
; -DARDUINO_M5STACK_CORES3.
; -----------------------------------------------------------------------------
[env:led-fluid-fire]
extends          = env:led-fluid
board            = m5stack-fire
upload_speed     = 921600
build_flags =
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_M5STACK_FIRE
	-I${PROJECT_DIR}/src
	; Meme correctif M5Unified 0.2.3 que le parent (voir [env:m5stack-cores3]) :
	; recopie ici parce que `extends` REMPLACE build_flags au lieu de le fusionner.
	-Wno-error=return-type
	; --- profil de carte (defauts = CoreS3/K151, voir main.cpp)
	-DSCE_INPUT_BUTTONS=1
	-DSCE_COMPANION=0
	-DSCE_HAS_PY32=0
	; SD sur VSPI (brochage M5Stack classique), et non les broches CoreS3
	-DSCE_SD_SCK=18 -DSCE_SD_MISO=19 -DSCE_SD_MOSI=23 -DSCE_SD_CS=4
	; WiFi de DERNIER RECOURS, pour un Fire SANS carte SD. La valeur vient de
	; l ENVIRONNEMENT du shell qui lance la compilation, jamais d ici : aucun
	; identifiant ne doit atterrir dans un fichier versionne (meme regle que
	; sdcard/stackchan-companion/config.yaml). Non definie => chaine vide => repli
	; en point d acces "SCE-Guest" sur 192.168.4.1, ou /config attend.
	;   $env:SCE_WIFI_SSID="..." ; $env:SCE_WIFI_PASS="..."
	-DSCE_WIFI_SSID='"${sysenv.SCE_WIFI_SSID}"'
	-DSCE_WIFI_PASS='"${sysenv.SCE_WIFI_PASS}"'

; -----------------------------------------------------------------------------
; native : tests unitaires sur PC — pio test -e native
; engine/ et behavior/ sont purs (pas d'Arduino) : les machines d'états se
; testent avec FakeClock, sans hardware. AUCUN build_src_filter : les tests
; incluent directement les headers via -I src.
; -----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/src
    ; Unity compile ses assertions flottantes en SIMPLE precision par defaut :
    ; TEST_ASSERT_DOUBLE_* echoue alors avec « Unity Double Precision Disabled »
    ; au lieu de comparer. Le bin space (astro.h/sgp4.h) est le premier a en
    ; avoir besoin -- la mecanique orbitale exige la mantisse du double, et un
    ; test qui ne sait pas comparer des doubles ne prouve rien.
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-12
build_src_filter = -<*>          ; pas de sources app — headers only via tests
